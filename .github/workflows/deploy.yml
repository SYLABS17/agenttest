name: Deploy Azure AI Research System

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install backend deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run backend tests
        run: pytest backend/tests
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: |
          cd frontend
          npm install --no-fund --no-audit
      - name: Run frontend tests
        run: |
          cd frontend
          npm run test

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure
        run: ./scripts/deploy_resources.sh ${{ secrets.AZURE_RESOURCE_GROUP }} ${{ vars.AZURE_LOCATION }} ${{ vars.AZURE_NAME_PREFIX }} ${{ secrets.OWNER_EMAIL }} prod ${{ vars.COST_CENTER }}
      - name: Deploy backend
        run: ./scripts/deploy_backend.sh ${{ vars.AZURE_WEB_APP }} ${{ secrets.AZURE_RESOURCE_GROUP }}
      - name: Deploy frontend
        run: ./scripts/deploy_frontend.sh ${{ vars.STORAGE_ACCOUNT }} ${{ vars.STATIC_CONTAINER }}

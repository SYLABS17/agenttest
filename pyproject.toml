[tool.poetry]
name = "multi-agent-salary-analysis"
version = "0.1.0"
description = "A multi-agent salary analysis system using LangGraph."
authors = ["Jules"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^0.0.30"
langchain = "^0.1.14"
langchain-openai = "^0.1.1"
pydantic = "^2.6.4"
langsmith = "^0.1.37"
opentelemetry-sdk = "^1.24.0"
opentelemetry-exporter-otlp = "^1.24.0"
pandas = "^2.2.1"
numpy = "^1.26.4"
scikit-learn = "^1.4.1.post1"
matplotlib = "^3.8.3"
seaborn = "^0.13.2"
python-dotenv = "^1.0.1"
typer = {extras = ["all"], version = "^0.9.0"}
pydantic-settings = "^2.2.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
